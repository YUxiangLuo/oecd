[project]
name = "oecd-icio-analysis"
version = "0.1.0"
description = "供应链仿真系统(GVC Simulation Lab)—— 基于全球投入产出数据库的价值链指标计算、可视化与回归分析"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "openpyxl>=3.1.0",
    "pandas>=3.0.3",
    "pymrio>=0.6.3",
    "networkx>=3.4",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
gvcsim = "gvcsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gvcsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
