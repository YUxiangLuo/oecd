[project]
name = "oecd-icio-analysis"
version = "0.1.0"
description = "供应链仿真系统(GVC Simulation Lab)—— 基于全球投入产出数据库的价值链指标计算、可视化与回归分析"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "openpyxl>=3.1.0",
    "pandas>=3.0.3",
    "pymrio>=0.6.3",
    "networkx>=3.4",
    "scipy>=1.18.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "linearmodels>=7.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
gvcsim = "gvcsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gvcsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["prototype"]

[tool.mypy]
python_version = "3.13"
files = ["gvcsim"]
ignore_missing_imports = true
warn_unused_configs = true
# pandas-heavy paths still have gradually typed internals; keep CI typecheck lightweight
# while preventing future syntax/signature regressions from going unnoticed.
disable_error_code = ["assignment", "attr-defined", "index", "arg-type"]

[tool.coverage.run]
source = ["gvcsim"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
