# /etc/nginx/conf.d/gvcsim.conf
# 将域名和证书路径替换为实际值；正式账号不得通过明文 HTTP 登录。

upstream gvcsim_api {
    server 127.0.0.1:18000;
    # Per Nginx worker: avoid filling the API's total connection budget with idle sockets.
    keepalive 8;
    keepalive_timeout 2s;
}

server {
    listen 80;
    listen [::]:80;
    server_name gvcsim.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gvcsim.example.edu;

    ssl_certificate /etc/letsencrypt/live/gvcsim.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gvcsim.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/gvcsim/current/frontend/dist;
    index index.html;
    client_max_body_size 2m;

    # 压缩页面、按需加载的脚本和 API 响应；实际传输体积随构建及所用页面变化。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://gvcsim_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://gvcsim_api/health;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /health/live {
        proxy_pass http://gvcsim_api/health/live;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /docs {
        deny all;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        # 子 location 定义 add_header 后不会继承 server 级响应头，必须完整重复。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "public, immutable" always;
    }

    # 讲义 PDF 在页面内用 <object> 预览：只允许同源嵌入，其余页面仍禁止被嵌入。
    location ^~ /readings/ {
        try_files $uri =404;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # index.html 必须每次重新验证，避免重新部署后浏览器仍引用已删除的旧 asset。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
