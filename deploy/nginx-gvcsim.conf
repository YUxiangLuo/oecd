# /etc/nginx/conf.d/gvcsim.conf
# 将域名和证书路径替换为实际值；正式账号不得通过明文 HTTP 登录。

limit_req_zone $binary_remote_addr zone=gvcsim_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gvcsim.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gvcsim.example.edu;

    ssl_certificate /etc/letsencrypt/live/gvcsim.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gvcsim.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/gvcsim/current/frontend/dist;
    index index.html;
    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=gvcsim_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:18000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18000/health;
        include proxy_params;
    }

    location /docs {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
