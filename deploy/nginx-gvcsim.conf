# /etc/nginx/conf.d/gvcsim.conf
# 将域名和证书路径替换为实际值；正式账号不得通过明文 HTTP 登录。
# 应用层按 IP+用户名做跨 worker 精确限流；这里仅阻断明显洪泛。20r/s +
# burst 120 可让同一校园 NAT 后的 100 名学生同时登录，不会误伤整班。

limit_req_zone $binary_remote_addr zone=gvcsim_login:10m rate=20r/s;

upstream gvcsim_api {
    server 127.0.0.1:18000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name gvcsim.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gvcsim.example.edu;

    ssl_certificate /etc/letsencrypt/live/gvcsim.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gvcsim.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/gvcsim/current/frontend/dist;
    index index.html;
    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=gvcsim_login burst=120 nodelay;
        proxy_pass http://gvcsim_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://gvcsim_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://gvcsim_api/health;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /health/live {
        proxy_pass http://gvcsim_api/health/live;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /docs {
        deny all;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
