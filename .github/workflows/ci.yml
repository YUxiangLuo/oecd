name: CI

on:
  push:
    branches:
      - cc
      - main
      - master
      - "feature/**"
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Run tests with coverage
        run: uv run pytest --cov=gvcsim --cov-report=term-missing -q

  frontend:
    name: Frontend build and E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Run frontend unit tests
        run: bun run test:unit
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run frontend E2E
        run: bun run test:e2e

  integration-smoke:
    name: Real API browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Generate tiny production-format artifacts
        run: uv run python tests/seed_e2e_data.py
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run browser against FastAPI and Vite
        working-directory: frontend
        env:
          REAL_API: "1"
        run: bunx playwright test e2e/real-api-smoke.spec.ts
